params:
  # General
  title: "Gallery"
  description: "A uniquely styled Hugo photo gallery theme."
  author:
    name: "YourName"
    email: "user@example.com"

  # .Param
  download:
    enable: true
    imageSpec: "fit 3200x3200"
  album:
    imageSpec:
      thumbnail: "fill 900x600"
  resource:
    image:
      sort:
        - { key: "params.weight", order: "asc" }
        - { key: "params.date", order: "desc" }
        - { key: "title", order: "asc" }
        - { key: "name", order: "asc" }
  gallery:
    photoSwipe:
      caption:
        enable: true
        items:
          - { format: "ISO ${Exif.ISO}", minWidth: "4rem" }
          - { format: "${Exif.FocalLengthIn35mmFormat} mm", minWidth: "4rem" }
          - { format: "${Exif.ExposureCompensation} ev", minWidth: "4rem" }
          - { format: "f ${Exif.FNumber-toType-float-%0.2f}", minWidth: "4rem" }
          - { format: "${Exif.ExposureTime} s", minWidth: "5rem" }
      fileInfo:
        enable: true
        firstBigger: true
        items:
          - { format: "${Title-title}" }
          - { format: '${SmartDate-dateFormat-2006\-01\-02 15:04:05 \-0700 MST}' }
          - { format: "${FileExt} · ${Megapixel-printf-%0.2f} MP · ${Resolution} · ${FileSize-div-1048576-%0.2f} MB" }
          - { format: "${Exif.Make} ${Exif.Model}" }
    justified:
      gutterH: 10
      gutterV: 10
      rowHeight: 320
      rowHeightTolerance: 0.25
    imageSpec:
      thumbnail: "fit 1200x1200"
      lightbox: "fit 1920x1920"
  watermark:
    enable: true
    path: "images/watermark/watermark.png" # Path: assets/...
    opacity: 0.2
    size: 0.05
    x: 0.5
    y: 0.5
  related:
    enable: true
    limit: 3

  # site.Params
  theme:
    color: "indigo"
    scheme: "auto" # Value: auto; light; dark;
    font:
      sans:
        family: ["SourceSans3VF", "Source Han Sans VF"]
      mono:
        family: ["SourceCodeVF", "Source Han Mono"]
  language:
    enable: false
  imageSpec:
    rssCover: "fill 900x600"
    openGraph: "fill 1200x630"
  social:
    enable: true
    items:
      - { name: "github", link: "https://github.com/zero-dream/hugo-zero/" }
      - { name: "envelope-fill", link: "mailto:user@example.com" }
      - { name: "youtube", link: "https://www.youtube.com/" }
      - { name: "facebook", link: "https://www.facebook.com/" }
  featured:
    enable: true
    imageSpec:
      thumbnail: "fill 1600x900"
  cssBuild:
    target: ["chrome115", "edge115", "firefox116", "ios16.4", "opera101", "safari16.4"]
