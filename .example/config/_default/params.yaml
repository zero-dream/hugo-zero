params:
  # General
  title: "Gallery"
  description: "A uniquely styled Hugo photo gallery theme."
  author:
    name: "YourName"
    email: "user@example.com"
  defaultTheme: "auto" # Value: auto; light; dark;

  # .Param
  download:
    enable: true
    imageSpec: "fit 3200x3200"
  album:
    imageSpec:
      thumbnail: "fill 1200x1200"
  image:
    sort:
      - { key: "params.weight", order: "asc" }
      - { key: "params.date", order: "desc" }
      - { key: "title", order: "asc" }
      - { key: "name", order: "asc" }
  gallery:
    photoSwipe:
      caption:
        enable: true
        data:
          - { format: "ISO ${Exif.ISO}", minWidth: "4rem" }
          - { format: "${Exif.FocalLengthIn35mmFormat} mm", minWidth: "4rem" }
          - { format: "${Exif.ExposureCompensation} ev", minWidth: "4rem" }
          - { format: "f ${Exif.FNumber-toType-float-%0.2f}", minWidth: "4rem" }
          - { format: "${Exif.ExposureTime} s", minWidth: "5rem" }
      fileInfo:
        enable: true
        firstBigger: true
        data:
          - { format: "${Title-title}" }
          - { format: '${SmartDate-dateFormat-2006\-01\-02 15:04:05 \-0700 MST}' }
          - { format: "${FileExt} · ${Megapixel} MP · ${Resolution} · ${FileSize-div-1048576-%0.2f} MB" }
          - { format: "${Exif.Make} ${Exif.Model}" }
    justified:
      gutterH: 10
      gutterV: 10
      rowHeight: 320
      rowHeightTolerance: 0.25
    imageSpec:
      thumbnail: "fit 1200x1200"
      lightbox: "fit 1920x1920"
  watermark:
    enable: true
    path: "images/watermark/watermark.png" # assets/...
    opacity: 0.2
    size: 0.05
    x: 0.5
    y: 0.5
  related:
    enable: true
    limit: 3

  # site.Params
  theme:
    font:
      sans:
        family: ["SourceSans3VF", "Source Han Sans VF"]
      mono:
        family: ["SourceCodeVF", "Source Han Mono"]
  language:
    enable: false
  imageSpec:
    rssCover: "fit 1200x1200"
    openGraph: "fill 1200x630"
    featured: "fill 1600x900"
  socialIcon:
    github: "https://github.com/zero-dream/hugo-gallery/"
    facebook: "https://www.facebook.com/"
    youtube: "https://www.youtube.com/"
    email: "mailto:user@example.com"
    whatsapp: "1234567890"
  cssBuild:
    target: ["chrome115", "edge115", "firefox116", "ios16.4", "opera101", "safari16.4"]
